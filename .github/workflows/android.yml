name: Android CI

on:

  push:
    branches: [ main ]

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Decode the release keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
        echo "KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

    - name: Build, test and sign with Gradle
      env:
        KEY_ALIAS: k6nele
        ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew build

    - name: Name the APK by its version
      run: |
        name=$(sed -n "s/^ *versionName '\(.*\)'$/\1/p" app/build.gradle)
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk "dist/K6nele-$name.apk"
        apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
        "$apksigner" verify --print-certs "dist/K6nele-$name.apk"

    - name: Upload the APK
      uses: actions/upload-artifact@v4
      with:
        name: k6nele-apk
        path: dist/*.apk
        if-no-files-found: error
